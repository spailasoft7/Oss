<style>
*{box-sizing:border-box;font-family:Poppins,sans-serif}body{margin:0;background:radial-gradient(circle at top,#222,#111 45%,#050505);color:#fff;padding:20px 20px 100px}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);border-radius:22px;padding:20px;margin:18px auto;max-width:700px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.logo{width:90px;height:90px;border-radius:50%;display:block;margin:auto;border:3px solid #FFD700}
h1,h2{color:#FFD700;text-align:center}

.value{color:#ddd;line-height:1.7}
.bottom-nav{position:fixed;left:15px;right:15px;bottom:15px;height:70px;background:#181818;border-radius:22px;display:flex;justify-content:space-around;align-items:center}
.bottom-nav a{text-decoration:none;color:#FFD700;text-align:center}.bottom-nav span{display:block;font-size:12px}
</style></head><body>
<div class="card">

<a class="btn" href="https://whatsapp.com/channel/0029Vb77X8xHAdNb7AGUmD0O"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
</div></div>

<div class="card"><div class="section-title"><i class="fa-solid fa-quote-left"></i><b>Daily Quote</b></div><div id="quote" class="value">Loading...</div></div>
<div class="card"><div class="section-title"><i class="fa-solid fa-book"></i><b>Word of the Day</b></div><div id="word" class="value">Loading...</div></div>
<div class="card"><div class="section-title"><i class="fa-solid fa-brain"></i><b>Fun Fact</b></div><div id="fact" class="value">Loading...</div></div>

</div>

<script>
async function loadData(){
try{
let q=await fetch("https://api.quotable.io/random").then(r=>r.json());
localStorage.setItem("quote",JSON.stringify(q));
document.getElementById("quote").innerHTML=`"${q.content}"<br><small>— ${q.author}</small>`;
}catch{
let q=JSON.parse(localStorage.getItem("quote")||'{"content":"Stay curious.","author":"Unknown"}');
document.getElementById("quote").innerHTML=`"${q.content}"<br><small>— ${q.author}</small>`;
}
try{
let f=await fetch("https://uselessfacts.jsph.pl/api/v2/facts/random").then(r=>r.json());
localStorage.setItem("fact",f.text);
document.getElementById("fact").textContent=f.text;
}catch{
document.getElementById("fact").textContent=localStorage.getItem("fact")||"No fact available offline.";
}
try{
let w=await fetch("https://random-word-api.herokuapp.com/word").then(r=>r.json());
let word=w[0];
let d=await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/"+word).then(r=>r.json());
let def=d[0].meanings[0].definitions[0].definition;
localStorage.setItem("word",JSON.stringify({word,def}));
document.getElementById("word").innerHTML=`<b>${word}</b><br>${def}`;
}catch{
let x=JSON.parse(localStorage.getItem("word")||'{"word":"Learn","def":"Gain knowledge."}');
document.getElementById("word").innerHTML=`<b>${x.word}</b><br>${x.def}`;
}
}
loadData();
</script>
