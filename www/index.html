<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OSIZWENI Announcements</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header-row">
  <div class="title-wrap">
    <h1>OSIZWENI <span>Secondary</span></h1>
  </div>
</div>

<!-- ================= BIG PROFILE ================= -->

<div class="profile-area">
  <div class="avatar-wrap">

    <img
      id="avatarImg"
      class="avatar-img"
      alt="Your avatar"
    >

    <div
      class="avatar-shuffle"
      id="avatarShuffle"
      title="Change avatar"
    >
      ⟳
    </div>

  </div>
</div>

<!-- ================= UPGRADE ================= -->

<div class="upgrade-strip" id="upgradeStrip">
  <span>🚀 Big upgrade pinned for later</span>
  <span class="close-strip" id="closeStrip">&times;</span>
</div>

<!-- ================= QUIZ ================= -->

<a href="quiz.html" class="quiz-promo">

  <div class="quiz-promo-text">

    <div class="quiz-promo-title">
      🎮 Quiz Zone
    </div>

    <div class="quiz-promo-sub">
      Play solo or battle your friends
    </div>

  </div>

  <div class="quiz-promo-arrow">
    →
  </div>

</a>

<!-- ================= FILTER ================= -->

<div class="controls">

  <button
    class="filter-pill"
    id="filterTrigger"
  >
    🎓 <span id="filterLabel">All Grades</span> ▾
  </button>

</div>

<!-- ================= NEWS ================= -->

<div id="news" class="news-container"></div>

<!-- ================= BOTTOM NAV ================= -->

<div class="bottom-nav">

  <button
    onclick="window.location.href='index.html'"
    class="active"
  >

    <div class="icon">

      <svg viewBox="0 0 24 24">
        <path d="M3 10.5L12 3l9 7.5"></path>
        <path d="M5 9.5V21h14V9.5"></path>
        <path d="M9 21v-7h6v7"></path>
      </svg>

    </div>

    <span>Home</span>

  </button>


  <button
    onclick="window.location.href='profile.html'"
  >

    <div class="icon">

      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"></path>
      </svg>

    </div>

    <span>Profile</span>

  </button>

</div>

<!-- ================= FILTER SHEET ================= -->

<div class="sheet-overlay" id="filterSheet">

  <div class="sheet">

    <div class="sheet-handle"></div>

    <h3>Filter by grade</h3>

    <div class="chip-row" id="chipRow">

      <button
        class="chip selected"
        data-grade="All"
      >
        All
      </button>

      <button class="chip" data-grade="8">
        Grade 8
      </button>

      <button class="chip" data-grade="9">
        Grade 9
      </button>

      <button class="chip" data-grade="10">
        Grade 10
      </button>

      <button class="chip" data-grade="11">
        Grade 11
      </button>

      <button class="chip" data-grade="12">
        Grade 12
      </button>

    </div>

  </div>

</div>

<!-- ================= READ MORE MODAL ================= -->

<div id="readMoreModal">

  <div class="modal-box">
<img id="readMoreImage" alt="">
    <span id="closeReadMore">
      &times;
    </span>

    <h2 id="readMoreTitle"></h2>

    <div id="readMoreMessage"></div>

  </div>

</div>

<div id="imageModal">
  <span id="closeImageModal">&times;</span>
  <img id="imageModalImg" alt="">
</div>

<script type="module" src="app.js"></script>
<script type="module" src="push-notifications.js"></script>

</body>
</html>
